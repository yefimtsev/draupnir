name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Check, Lint, Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt -- --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy -- -D warnings
      - run: cargo test

  installer:
    # Runs install.ps1 the way users do (piped into iex) in Windows PowerShell 5.1, against
    # the latest published release.
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install
        env:
          DRAUPNIR_VAULT_ROOT: C:\draupnir test\vault
        run: Get-Content ./install.ps1 -Raw | Invoke-Expression
      - name: Check the install
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\draupnir'
          $userPath = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';') -notcontains $dir) { throw "not on the user PATH: $userPath" }
          $root = & "$dir\draupnir.exe" vault root
          if ($root.Replace('\', '/') -ne 'C:/draupnir test/vault') { throw "vault root is '$root'" }
          $home_ = if ($env:HOME) { $env:HOME } else { $env:USERPROFILE }
          if (-not (Test-Path "$home_\.claude\skills\draupnir-resume\SKILL.md")) { throw 'skills not installed' }
      - name: A second run keeps the config
        env:
          DRAUPNIR_VAULT_ROOT: C:\elsewhere
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content ./install.ps1 -Raw | Invoke-Expression
          $root = & "$env:LOCALAPPDATA\Programs\draupnir\draupnir.exe" vault root
          if ($root.Replace('\', '/') -ne 'C:/draupnir test/vault') { throw "config was overwritten: '$root'" }
      - name: Warns about a copy that only the saved PATH knows
        run: |
          $ErrorActionPreference = 'Stop'
          # The folder goes into the registry PATH only, like an install made after this shell started.
          # The stray quote and the quoted entry are junk real PATHs carry; they must not stop the run.
          New-Item -ItemType Directory -Force C:\dupe | Out-Null
          Copy-Item "$env:LOCALAPPDATA\Programs\draupnir\draupnir.exe" C:\dupe\draupnir.exe
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $saved = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $key.SetValue('Path', "C:\Program Files\Junk`";`"C:\dupe`";$saved", 'ExpandString')
          $out = Get-Content ./install.ps1 -Raw | Invoke-Expression 3>&1 | Out-String
          $key.SetValue('Path', $saved, 'ExpandString')
          Remove-Item C:\dupe -Recurse -Force
          if ($out -notmatch 'Another draupnir is on PATH at C:\\dupe\\draupnir.exe') { throw "no warning in:`n$out" }
          if ($out -match 'Illegal characters|Exception') { throw "junk PATH entry broke the run:`n$out" }
      - name: Uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          & ([scriptblock]::Create((Get-Content ./install.ps1 -Raw))) -Uninstall
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\draupnir'
          if (Test-Path $dir) { throw "$dir still exists" }
          $userPath = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';') -contains $dir) { throw 'PATH entry left behind' }

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiki-e/install-action@089a51b004779caac82d134bb53aa38864ee4289 # v2.75.2
        with:
          tool: cargo-audit
      - run: cargo audit
