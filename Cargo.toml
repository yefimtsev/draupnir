[package]
name = "draupnir-cli"
version = "0.6.3"
edition = "2024"
description = "CLI for the Draupnir vault — session logs, instincts, briefs, and health checks"
license = "MIT"
repository = "https://github.com/yefimtsev/draupnir"

[[bin]]
name = "draupnir"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "6"
owo-colors = { version = "4", features = ["supports-colors"] }
glob = "0.3"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
tempfile = "3"
